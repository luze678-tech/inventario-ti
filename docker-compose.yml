services:
  app:
    build: .
    container_name: mi-app-container
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      local_network: {}

networks:
  local_network:
      name: inventario-ti
      external: true

  